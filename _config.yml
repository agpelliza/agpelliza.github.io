markdown: kramdown
highlighter: rouge
url: https://agpelliza.github.io
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - bin
  - vendor
defaults:
  - scope:
      path: training
    values:
      layout: training
      lang: es
      permalink: /training/:basename/
  - scope:
      path: training/ejercicios
    values:
      layout: ejercicio
      permalink: /training/ejercicios/:basename/
